<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spelling Bee</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --yellow: #f7da21;
  --yellow-dark: #e2c400;
  --hex-outer: #e6e6e6;
  --hex-outer-hover: #d2d2d2;
  --bg: #fff;
  --text: #1b1b1b;
  --border: #ddd;
  --pangram: #b4860d;
  --found-bg: #f7f7f7;
  --hint-bg: #fafafa;
  --hint-border: #e0e0e0;
}

body {
  font-family: 'Helvetica Neue', Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ── HEADER ── */
header {
  width: 100%;
  max-width: 860px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
}

header h1 {
  font-size: 1.5rem;
  font-weight: 700;
  letter-spacing: -0.5px;
}

#score-area {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 0.9rem;
}

#rank-label {
  font-weight: 700;
  font-size: 0.95rem;
}

#progress-track {
  width: 120px;
  height: 6px;
  background: #e0e0e0;
  border-radius: 3px;
  overflow: visible;
  position: relative;
}

#progress-fill {
  height: 100%;
  background: var(--yellow);
  border-radius: 3px;
  transition: width 0.4s ease;
}

#score-val {
  font-weight: 700;
  min-width: 28px;
  text-align: right;
}

/* ── LAYOUT ── */
#app {
  display: flex;
  gap: 24px;
  padding: 20px;
  max-width: 860px;
  width: 100%;
  flex-wrap: wrap;
  justify-content: center;
}

/* ── FOUND WORDS ── */
#found-bar {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  padding: 8px 14px;
  border: 1px solid var(--border);
  border-radius: 24px;
  min-height: 44px;
  min-width: 260px;
  cursor: pointer;
  user-select: none;
  background: var(--bg);
  width: 100%;
  max-width: 420px;
}

#found-count {
  font-size: 0.82rem;
  color: #777;
  font-weight: 600;
  white-space: nowrap;
}

.found-word {
  font-size: 0.82rem;
  font-weight: 600;
  white-space: nowrap;
}

.found-word.pangram { color: var(--pangram); }

/* ── TOAST ── */
#toast {
  position: fixed;
  top: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(-12px);
  background: var(--text);
  color: #fff;
  padding: 8px 18px;
  border-radius: 20px;
  font-weight: 700;
  font-size: 0.95rem;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.2s, transform 0.2s;
  z-index: 100;
}
#toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
#toast.nice { background: #3c763d; }
#toast.pangram-toast { background: var(--pangram); }

/* ── GAME COLUMN ── */
#game-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  flex: 0 0 auto;
}

/* ── INPUT DISPLAY ── */
#input-display {
  font-size: 2rem;
  font-weight: 700;
  letter-spacing: 3px;
  min-height: 48px;
  min-width: 200px;
  text-align: center;
  color: var(--text);
}

#input-display .center-letter { color: var(--yellow-dark); }

#input-cursor {
  display: inline-block;
  width: 2px;
  height: 1.8rem;
  background: var(--text);
  margin-left: 2px;
  vertical-align: middle;
  animation: blink 1s step-end infinite;
}
@keyframes blink { 50% { opacity: 0; } }

/* ── HONEYCOMB ── */
#hive-wrap {
  position: relative;
  width: 262px;
  height: 252px;
}

#hive-svg {
  width: 262px;
  height: 252px;
  overflow: visible;
}

.hex-cell {
  cursor: pointer;
  transition: opacity 0.1s;
}
.hex-cell:active { opacity: 0.7; }

.hex-poly {
  transition: fill 0.1s;
}

.hex-poly.center-hex { fill: var(--yellow); }
.hex-poly.outer-hex  { fill: var(--hex-outer); }

.hex-cell:hover .center-hex { fill: var(--yellow-dark); }
.hex-cell:hover .outer-hex  { fill: var(--hex-outer-hover); }

.hex-text {
  font-family: 'Helvetica Neue', Arial, sans-serif;
  font-size: 22px;
  font-weight: 700;
  fill: var(--text);
  text-anchor: middle;
  dominant-baseline: central;
  pointer-events: none;
  text-transform: uppercase;
}

/* ── CONTROL BUTTONS ── */
#controls {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: center;
}

.btn {
  padding: 12px 20px;
  border-radius: 24px;
  border: 1.5px solid var(--text);
  background: transparent;
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  white-space: nowrap;
}
.btn:hover { background: var(--text); color: #fff; }
.btn.primary { background: var(--text); color: #fff; }
.btn.primary:hover { background: #444; border-color: #444; }

/* ── HINTS PANEL ── */
#hints-panel {
  flex: 1 1 280px;
  max-width: 380px;
  min-width: 260px;
  border: 1.5px solid var(--hint-border);
  border-radius: 12px;
  background: var(--hint-bg);
  padding: 18px 20px;
  font-size: 0.9rem;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

#hints-panel.hidden { display: none; }

#hints-panel h2 {
  font-size: 1.05rem;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

#close-hints {
  background: none;
  border: none;
  font-size: 1.1rem;
  cursor: pointer;
  color: #888;
  padding: 0 4px;
  line-height: 1;
}
#close-hints:hover { color: var(--text); }

/* Hints mode toggle */
#hints-mode {
  display: flex;
  border: 1.5px solid var(--border);
  border-radius: 20px;
  overflow: hidden;
  width: fit-content;
}

.mode-btn {
  padding: 5px 14px;
  border: none;
  background: transparent;
  font-size: 0.82rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s;
}
.mode-btn.active { background: var(--text); color: #fff; }

/* Summary */
#hints-summary {
  font-size: 0.88rem;
  line-height: 1.6;
  color: #555;
}
#hints-summary strong { color: var(--text); }

/* Hints matrix */
#hints-matrix-wrap {
  overflow-x: auto;
}

#hints-matrix {
  border-collapse: collapse;
  font-size: 0.82rem;
  width: 100%;
}
#hints-matrix th, #hints-matrix td {
  text-align: center;
  padding: 5px 8px;
  border: 1px solid var(--hint-border);
  min-width: 30px;
}
#hints-matrix th {
  background: var(--found-bg);
  font-weight: 700;
}
#hints-matrix td { font-variant-numeric: tabular-nums; }
#hints-matrix .row-label {
  text-align: center;
  font-weight: 700;
  background: var(--found-bg);
  text-transform: uppercase;
}
#hints-matrix .total-row td,
#hints-matrix .total-row th { background: #f0f0f0; font-weight: 700; }
#hints-matrix .found { color: #bbb; }
#hints-matrix .cell-zero { color: #ccc; }

/* Two-letter list */
#two-letter-list {
  column-count: 3;
  column-gap: 8px;
  font-size: 0.82rem;
  line-height: 1.8;
}
.tl-item {
  font-variant-numeric: tabular-nums;
  break-inside: avoid;
}
.tl-item .tl-prefix { font-weight: 700; text-transform: uppercase; }
.tl-item .tl-found { color: #bbb; }

/* ── RESPONSIVE ── */
@media (max-width: 600px) {
  #app { padding: 12px; gap: 16px; }
  #hints-panel { max-width: 100%; width: 100%; }
  .btn { padding: 10px 16px; font-size: 0.85rem; }
  #input-display { font-size: 1.7rem; }
}

/* ── NEW PUZZLE OVERLAY ── */
#loading-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(255,255,255,0.85);
  z-index: 200;
  align-items: center;
  justify-content: center;
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--text);
}
#loading-overlay.show { display: flex; }

/* ── CONGRATS BANNER ── */
#congrats {
  display: none;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 20px;
  background: var(--yellow);
  border-radius: 8px;
  font-weight: 700;
  font-size: 1rem;
  width: 100%;
  max-width: 420px;
}
#congrats.show { display: flex; }
</style>
</head>
<body>

<header>
  <h1>Spelling Bee</h1>
  <div id="score-area">
    <span id="rank-label">Beginner</span>
    <div id="progress-track"><div id="progress-fill" style="width:0%"></div></div>
    <span id="score-val">0</span>
  </div>
</header>

<div id="toast"></div>
<div id="loading-overlay">Generating puzzle…</div>

<div id="app">
  <!-- Found words bar -->
  <div id="found-bar" title="Your found words">
    <span id="found-count">–</span>
  </div>

  <div id="congrats">Queen Bee! You found every word!</div>

  <!-- Game column -->
  <div id="game-col">
    <div id="input-display"><span id="input-cursor"></span></div>

    <!-- Honeycomb SVG -->
    <div id="hive-wrap">
      <svg id="hive-svg" viewBox="0 0 262 252"></svg>
    </div>

    <!-- Buttons -->
    <div id="controls">
      <button class="btn" onclick="deleteLetter()">Delete</button>
      <button class="btn" onclick="shuffleOuter()">Shuffle</button>
      <button class="btn primary" onclick="submitWord()">Enter</button>
    </div>
    <div id="controls" style="margin-top:-4px">
      <button class="btn" id="hints-btn" onclick="toggleHints()">Show Hints</button>
      <button class="btn" onclick="newPuzzle()">New Puzzle</button>
    </div>
  </div>

  <!-- Hints panel -->
  <div id="hints-panel" class="hidden">
    <h2>Hints <button id="close-hints" onclick="toggleHints()" title="Hide hints">&times;</button></h2>

    <div id="hints-mode">
      <button class="mode-btn active" id="mode-all"   onclick="setHintsMode('all')">All</button>
      <button class="mode-btn"        id="mode-left"  onclick="setHintsMode('remaining')">Remaining</button>
    </div>

    <div id="hints-summary"></div>

    <div>
      <div style="font-weight:700;font-size:0.85rem;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px">
        Words by length
      </div>
      <div id="hints-matrix-wrap">
        <table id="hints-matrix"></table>
      </div>
    </div>

    <div>
      <div style="font-weight:700;font-size:0.85rem;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px">
        Two-letter list
      </div>
      <div id="two-letter-list"></div>
    </div>
  </div>
</div>

const WORD_SET = new Set(WORDS_RAW.split('\n'));

// ─── CONSTANTS ───────────────────────────────────────────────────────────────
const RANKS = [
  { name: 'Beginner',   pct: 0   },
  { name: 'Good Start', pct: 2   },
  { name: 'Moving Up',  pct: 5   },
  { name: 'Good',       pct: 8   },
  { name: 'Solid',      pct: 15  },
  { name: 'Nice',       pct: 25  },
  { name: 'Great',      pct: 40  },
  { name: 'Amazing',    pct: 50  },
  { name: 'Genius',     pct: 70  },
  { name: 'Queen Bee',  pct: 100 },
];

const TOAST_MSGS = {
  too_short:      'Too short',
  missing_center: 'Missing center letter',
  wrong_letters:  'Bad letters',
  not_in_list:    'Not in word list',
  already_found:  'Already found',
};

// ─── STATE ───────────────────────────────────────────────────────────────────
let puzzle      = null;   // { letters[], center, words[], totalScore }
let found       = new Set();
let playerScore = 0;
let currentInput = '';
let outerOrder  = [];     // shuffleable order of the 6 outer letters
let hintsMode   = 'all';  // 'all' | 'remaining'
let hintsVisible = false;

// ─── HEX GEOMETRY ────────────────────────────────────────────────────────────
const R   = 40;   // circumradius
const D   = Math.round(R * Math.sqrt(3)); // ~69; center-to-center distance

// Center of the SVG canvas
const CX = 131;
const CY = 126;

// 6 outer hex directions (flat-top, angles in degrees: 0,60,120,180,240,300)
// y-axis points DOWN in SVG, so "up" is negative y
const HEX_DIRS = [
  [0,   1],   // E
  [-60, 1],   // NE  (in SVG: y is up when angle < 0)
  [-120,1],   // NW
  [180, 1],   // W
  [120, 1],   // SW
  [60,  1],   // SE
].map(([deg]) => {
  const rad = (deg * Math.PI) / 180;
  return [Math.round(Math.cos(rad) * D), Math.round(Math.sin(rad) * D)];
});

function hexPoints(cx, cy) {
  const pts = [];
  for (let i = 0; i < 6; i++) {
    const a = (i * 60 * Math.PI) / 180;
    pts.push(`${Math.round(cx + R * Math.cos(a))},${Math.round(cy + R * Math.sin(a))}`);
  }
  return pts.join(' ');
}

// ─── SCORING ─────────────────────────────────────────────────────────────────
function wordScore(word) {
  if (word.length === 4) return 1;
  const base = word.length;
  const pangramBonus = new Set(word).size === puzzle.letters.length ? 7 : 0;
  return base + pangramBonus;
}

function computeTotalScore(words) {
  return words.reduce((s, w) => s + wordScore(w), 0);
}

function getRank(score, total) {
  const pct = total > 0 ? (score / total) * 100 : 0;
  let rank = RANKS[0];
  for (const r of RANKS) { if (pct >= r.pct) rank = r; }
  return rank;
}

// ─── PUZZLE GENERATION ───────────────────────────────────────────────────────
function generatePuzzle(minWords = 20) {
  const allWords = Array.from(WORD_SET);

  // Find candidate pangrams (exactly 7 unique letters, 4-9 chars)
  const pangrams = allWords.filter(w => new Set(w).size === 7);

  // Shuffle to get a random puzzle each time
  for (let i = pangrams.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pangrams[i], pangrams[j]] = [pangrams[j], pangrams[i]];
  }

  for (const pg of pangrams) {
    const letters = [...new Set(pg)].sort();
    const letterSet = new Set(letters);

    // All words usable with this letter set
    const validWords = allWords.filter(w =>
      w.length >= 4 && [...w].every(c => letterSet.has(c))
    );

    if (validWords.length < minWords) continue;

    // Find the best center letter (most words contain it)
    let bestCenter = null, bestCount = 0;
    for (const letter of letters) {
      const cnt = validWords.filter(w => w.includes(letter)).length;
      if (cnt > bestCount) { bestCount = cnt; bestCenter = letter; }
    }

    const wordsWithCenter = validWords.filter(w => w.includes(bestCenter));
    if (wordsWithCenter.length < minWords) continue;

    return {
      letters,
      center: bestCenter,
      words: wordsWithCenter,
      totalScore: computeTotalScore(wordsWithCenter),
      pangrams: wordsWithCenter.filter(w => new Set(w).size === letters.length),
    };
  }
  return null;
}

// ─── HINTS ───────────────────────────────────────────────────────────────────
function computeHints(words) {
  const startLetters = [...new Set(words.map(w => w[0]))].sort();
  const lengths      = [...new Set(words.map(w => w.length))].sort((a, b) => a - b);

  const matrix = {};
  for (const l of startLetters) {
    matrix[l] = {};
    for (const len of lengths) {
      const cnt = words.filter(w => w[0] === l && w.length === len).length;
      matrix[l][len] = cnt;
    }
  }

  const twoLetter = {};
  for (const w of words) {
    if (w.length < 2) continue;
    const key = w.slice(0, 2);
    twoLetter[key] = (twoLetter[key] || 0) + 1;
  }

  return { matrix, lengths, startLetters, twoLetter };
}

function renderHints() {
  if (!puzzle) return;

  const remainingWords = puzzle.words.filter(w => !found.has(w));
  const activeWords    = hintsMode === 'remaining' ? remainingWords : puzzle.words;

  const allHints = computeHints(puzzle.words);
  const remHints = computeHints(remainingWords); // always "what's left"

  // ── Summary ──────────────────────────────────────────────────────────────
  const remPangrams = puzzle.pangrams.filter(w => !found.has(w)).length;
  const showPangrams = hintsMode === 'remaining' ? remPangrams : puzzle.pangrams.length;
  const showPoints   = activeWords.reduce((s, w) => s + wordScore(w), 0);
  document.getElementById('hints-summary').innerHTML =
    `<strong>${activeWords.length}</strong> word${activeWords.length !== 1 ? 's' : ''} &nbsp;·&nbsp; ` +
    `<strong>${showPangrams}</strong> pangram${showPangrams !== 1 ? 's' : ''} &nbsp;·&nbsp; ` +
    `<strong>${showPoints}</strong> points`;

  // ── Letter × Length matrix ───────────────────────────────────────────────
  const allLengths = allHints.lengths; // always use full length range as columns

  let tableHTML = '<thead><tr><th></th>';
  for (const len of allLengths) tableHTML += `<th>${len}</th>`;
  tableHTML += '<th>Σ</th></tr></thead><tbody>';

  const colTotals = {};
  for (const len of allLengths) colTotals[len] = 0;

  for (const l of allHints.startLetters) {
    let rowTotal = 0;
    let hasAny   = false;
    let rowHTML  = `<tr><td class="row-label">${l}</td>`;

    for (const len of allLengths) {
      const total    = (allHints.matrix[l] || {})[len] || 0;
      const rem      = (remHints.matrix[l]  || {})[len] || 0;
      const val      = hintsMode === 'remaining' ? rem : total;
      const allDone  = total > 0 && rem === 0; // all words in this cell found

      if (val === 0) {
        rowHTML += `<td class="cell-zero">-</td>`;
      } else {
        rowHTML += `<td class="${hintsMode === 'all' && allDone ? 'found' : ''}">${val}</td>`;
        hasAny = true;
      }
      colTotals[len] += val;
      rowTotal       += val;
    }

    // In 'remaining' mode, skip rows where everything has been found
    if (hintsMode === 'remaining' && !hasAny) continue;

    rowHTML += `<td>${rowTotal || '-'}</td></tr>`;
    tableHTML += rowHTML;
  }

  // Totals row
  tableHTML += '<tr class="total-row"><th>Σ</th>';
  let gt = 0;
  for (const len of allLengths) {
    tableHTML += `<td>${colTotals[len] || '-'}</td>`;
    gt += colTotals[len] || 0;
  }
  tableHTML += `<td>${gt}</td></tr></tbody>`;

  document.getElementById('hints-matrix').innerHTML = tableHTML;

  // ── Two-letter list ──────────────────────────────────────────────────────
  // Always iterate over allHints so we can detect fully-found prefixes
  const tlEntries = Object.entries(allHints.twoLetter).sort(([a], [b]) => a.localeCompare(b));

  let tlHTML = '';
  for (const [prefix, total] of tlEntries) {
    const rem      = remHints.twoLetter[prefix] || 0;
    const display  = hintsMode === 'remaining' ? rem : total;
    const allDone  = total > 0 && rem === 0;

    if (hintsMode === 'remaining' && display === 0) continue;

    tlHTML += `<div class="tl-item">` +
      `<span class="tl-prefix${hintsMode === 'all' && allDone ? ' tl-found' : ''}">${prefix}</span>: ${display}` +
      `</div>`;
  }
  document.getElementById('two-letter-list').innerHTML = tlHTML;
}

// ─── UI RENDERING ────────────────────────────────────────────────────────────
function renderHoneycomb() {
  const svg = document.getElementById('hive-svg');
  svg.innerHTML = '';

  const positions = [
    [CX, CY], // 0 = center
    ...HEX_DIRS.map(([dx, dy]) => [CX + dx, CY + dy]),
  ];

  // positions[0] = center, positions[1..6] = outer in HEX_DIRS order
  // outerOrder contains indices into puzzle.letters (excluding center)
  const outerLetters = puzzle.letters.filter(l => l !== puzzle.center);

  for (let i = 0; i < 7; i++) {
    const isCenter = i === 0;
    const letter = isCenter ? puzzle.center : outerLetters[outerOrder[i - 1]];
    const [cx, cy] = positions[i];

    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('class', 'hex-cell');
    g.addEventListener('click', () => addLetter(letter));

    const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
    poly.setAttribute('points', hexPoints(cx, cy));
    poly.setAttribute('class', `hex-poly ${isCenter ? 'center-hex' : 'outer-hex'}`);
    g.appendChild(poly);

    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    text.setAttribute('x', cx);
    text.setAttribute('y', cy);
    text.setAttribute('class', 'hex-text');
    text.textContent = letter.toUpperCase();
    g.appendChild(text);

    svg.appendChild(g);
  }
}

function renderInput() {
  const display = document.getElementById('input-display');
  if (!currentInput) {
    display.innerHTML = '<span id="input-cursor"></span>';
    return;
  }
  const html = [...currentInput].map(c => {
    const cls = c === puzzle.center ? ' class="center-letter"' : '';
    return `<span${cls}>${c.toUpperCase()}</span>`;
  }).join('');
  display.innerHTML = html + '<span id="input-cursor"></span>';
}

function renderFoundWords() {
  const bar = document.getElementById('found-bar');
  const count = found.size;

  if (count === 0) {
    bar.innerHTML = '<span id="found-count">–</span>';
    return;
  }

  const sorted = [...found].sort();
  const html = `<span id="found-count">${count} word${count !== 1 ? 's' : ''}</span>` +
    sorted.map(w => {
      const isPangram = new Set(w).size === puzzle.letters.length;
      return `<span class="found-word${isPangram ? ' pangram' : ''}">${w}</span>`;
    }).join('<span style="color:#bbb"> · </span>');

  bar.innerHTML = html;
}

function renderScore() {
  const rank = getRank(playerScore, puzzle.totalScore);
  document.getElementById('rank-label').textContent = rank.name;
  document.getElementById('score-val').textContent  = playerScore;

  const pct = puzzle.totalScore > 0 ? (playerScore / puzzle.totalScore) * 100 : 0;
  document.getElementById('progress-fill').style.width = Math.min(100, pct) + '%';

  if (found.size === puzzle.words.length) {
    document.getElementById('congrats').classList.add('show');
  }
}

// ─── INPUT HANDLING ───────────────────────────────────────────────────────────
function addLetter(letter) {
  currentInput += letter;
  renderInput();
}

function deleteLetter() {
  if (currentInput.length === 0) return;
  currentInput = currentInput.slice(0, -1);
  renderInput();
}

function shuffleOuter() {
  for (let i = outerOrder.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [outerOrder[i], outerOrder[j]] = [outerOrder[j], outerOrder[i]];
  }
  renderHoneycomb();
}

function validateWord(word) {
  if (word.length < 4) return 'too_short';
  if (!word.includes(puzzle.center)) return 'missing_center';
  const letterSet = new Set(puzzle.letters);
  if ([...word].some(c => !letterSet.has(c))) return 'wrong_letters';
  if (!WORD_SET.has(word)) return 'not_in_list';
  if (found.has(word)) return 'already_found';
  return 'valid';
}

function submitWord() {
  const word = currentInput.trim().toLowerCase();
  if (!word) return;

  const status = validateWord(word);
  if (status === 'valid') {
    found.add(word);
    playerScore += wordScore(word);
    const isPangram = new Set(word).size === puzzle.letters.length;
    showToast(isPangram ? 'Pangram!' : positiveMsg(word.length), isPangram ? 'pangram-toast' : 'nice');
    currentInput = '';
    renderInput();
    renderFoundWords();
    renderScore();
    if (hintsVisible) renderHints();
  } else {
    showToast(TOAST_MSGS[status] || 'Try again');
  }
}

function positiveMsg(len) {
  if (len <= 4) return 'Good!';
  if (len <= 5) return 'Nice!';
  if (len <= 6) return 'Great!';
  if (len <= 7) return 'Excellent!';
  return 'Amazing!';
}

// ─── TOAST ───────────────────────────────────────────────────────────────────
let toastTimer = null;
function showToast(msg, cls = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show' + (cls ? ' ' + cls : '');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = ''; }, 1800);
}

// ─── HINTS TOGGLE ────────────────────────────────────────────────────────────
function toggleHints() {
  hintsVisible = !hintsVisible;
  document.getElementById('hints-panel').classList.toggle('hidden', !hintsVisible);
  document.getElementById('hints-btn').textContent = hintsVisible ? 'Hide Hints' : 'Show Hints';
  if (hintsVisible) renderHints();
}

function setHintsMode(mode) {
  hintsMode = mode;
  document.getElementById('mode-all').classList.toggle('active', mode === 'all');
  document.getElementById('mode-left').classList.toggle('active', mode === 'remaining');
  renderHints();
}

// ─── NEW PUZZLE ───────────────────────────────────────────────────────────────
function newPuzzle() {
  const overlay = document.getElementById('loading-overlay');
  overlay.classList.add('show');
  document.getElementById('congrats').classList.remove('show');

  // Run generation after a microtask so the overlay paints first
  setTimeout(() => {
    const p = generatePuzzle(20);
    if (!p) { alert('Could not generate a puzzle. Please try again.'); overlay.classList.remove('show'); return; }

    puzzle      = p;
    found       = new Set();
    playerScore = 0;
    currentInput = '';
    outerOrder  = [...Array(puzzle.letters.filter(l => l !== puzzle.center).length).keys()];

    renderHoneycomb();
    renderInput();
    renderFoundWords();
    renderScore();
    if (hintsVisible) renderHints();

    overlay.classList.remove('show');
  }, 30);
}

// ─── KEYBOARD ────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (!puzzle) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;

  if (e.key === 'Enter')     { submitWord(); return; }
  if (e.key === 'Backspace') { deleteLetter(); return; }

  const ch = e.key.toLowerCase();
  if (/^[a-z]$/.test(ch)) {
    if (new Set(puzzle.letters).has(ch)) addLetter(ch);
    else showToast('Bad letters');
  }
});

// ─── INIT ────────────────────────────────────────────────────────────────────
window.addEventListener('load', () => {
  newPuzzle();
});
</script>
