<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Theseus and the Minotaur</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a2e;
    color: #e0e0e0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  h1 {
    font-size: 1.8rem;
    margin-bottom: 4px;
    color: #e2b340;
    text-shadow: 0 0 20px rgba(226, 179, 64, 0.3);
    letter-spacing: 2px;
  }

  .subtitle {
    font-size: 0.85rem;
    color: #888;
    margin-bottom: 16px;
  }

  #controls {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
    flex-wrap: wrap;
    justify-content: center;
  }

  button {
    background: #16213e;
    color: #e0e0e0;
    border: 1px solid #0f3460;
    padding: 6px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.85rem;
    transition: background 0.15s, border-color 0.15s;
  }

  button:hover { background: #0f3460; border-color: #e2b340; }
  button:active { background: #e2b340; color: #1a1a2e; }

  #level-select {
    background: #16213e;
    color: #e0e0e0;
    border: 1px solid #0f3460;
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 0.85rem;
  }

  #status {
    font-size: 1rem;
    margin-bottom: 10px;
    min-height: 1.4em;
    color: #ccc;
  }

  #status.win { color: #4ecca3; font-weight: bold; }
  #status.lose { color: #e74c3c; font-weight: bold; }

  #game-container {
    position: relative;
    display: inline-block;
  }

  canvas {
    display: block;
    border-radius: 4px;
  }

  #move-info {
    margin-top: 10px;
    font-size: 0.8rem;
    color: #666;
    text-align: center;
  }

  .legend {
    display: flex;
    gap: 18px;
    margin-top: 12px;
    font-size: 0.8rem;
    color: #999;
    flex-wrap: wrap;
    justify-content: center;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .legend-swatch {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    display: inline-block;
  }

  #dpad {
    display: grid;
    grid-template-areas:
      ".  up  ."
      "left wait right"
      ".  down .";
    grid-template-columns: repeat(3, 52px);
    grid-template-rows: repeat(3, 52px);
    gap: 4px;
    margin-top: 14px;
  }

  #dpad button {
    width: 52px;
    height: 52px;
    font-size: 1.2rem;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
  }

  #dpad button[data-dir="up"]    { grid-area: up; }
  #dpad button[data-dir="left"]  { grid-area: left; }
  #dpad button[data-dir="wait"]  { grid-area: wait; font-size: 0.7rem; }
  #dpad button[data-dir="right"] { grid-area: right; }
  #dpad button[data-dir="down"]  { grid-area: down; }

  @media (max-width: 500px) {
    h1 { font-size: 1.3rem; }
    #dpad { grid-template-columns: repeat(3, 46px); grid-template-rows: repeat(3, 46px); }
    #dpad button { width: 46px; height: 46px; }
  }
</style>
</head>
<body>

<h1>THESEUS &amp; THE MINOTAUR</h1>
<p class="subtitle">Navigate Theseus to the exit. The Minotaur takes 2 steps for each of yours.</p>

<div id="controls">
  <label>
    Level:
    <select id="level-select"></select>
  </label>
  <button id="btn-undo">Undo (Z)</button>
  <button id="btn-restart">Restart (R)</button>
</div>

<div id="status">&nbsp;</div>

<div id="game-container">
  <canvas id="maze-canvas"></canvas>
</div>

<div id="dpad">
  <button data-dir="up" title="Up (Arrow/W)">&#9650;</button>
  <button data-dir="left" title="Left (Arrow/A)">&#9664;</button>
  <button data-dir="wait" title="Wait (Space/S)">Wait</button>
  <button data-dir="right" title="Right (Arrow/D)">&#9654;</button>
  <button data-dir="down" title="Down (Arrow/S)">&#9660;</button>
</div>

<div class="legend">
  <span class="legend-item"><span class="legend-swatch" style="background:#3498db"></span> Theseus</span>
  <span class="legend-item"><span class="legend-swatch" style="background:#e74c3c"></span> Minotaur</span>
  <span class="legend-item"><span class="legend-swatch" style="background:#4ecca3"></span> Exit</span>
</div>

<div id="move-info">Arrow keys / WASD to move &middot; Space to wait &middot; Z to undo &middot; R to restart</div>

<script>
// ============================================================
// THESEUS AND THE MINOTAUR - Maze Puzzle Game
// ============================================================
// Walls are stored per-cell as bitmask: N=1, E=2, S=4, W=8
// The Minotaur moves horizontally-first toward Theseus, 2 moves per turn.

const NORTH = 1, EAST = 2, SOUTH = 4, WEST = 8;
const DX = { [NORTH]: 0, [EAST]: 1, [SOUTH]: 0, [WEST]: -1 };
const DY = { [NORTH]: -1, [EAST]: 0, [SOUTH]: 1, [WEST]: 0 };
const OPPOSITE = { [NORTH]: SOUTH, [EAST]: WEST, [SOUTH]: NORTH, [WEST]: EAST };

// ---- Level Definitions ----
// Each level: { cols, rows, theseus:[x,y], minotaur:[x,y], exit:[x,y], exitDir, walls }
// walls is a flat array of bitmasks (row-major). Border walls are added automatically.
// exitDir: which border side the exit is on (for drawing the exit gap).

function makeBorderWalls(cols, rows) {
  const w = new Uint8Array(cols * rows);
  for (let x = 0; x < cols; x++) {
    w[x] |= NORTH;                       // top row
    w[(rows - 1) * cols + x] |= SOUTH;   // bottom row
  }
  for (let y = 0; y < rows; y++) {
    w[y * cols] |= WEST;                 // left col
    w[y * cols + (cols - 1)] |= EAST;    // right col
  }
  return w;
}

function mergeWalls(cols, rows, innerWalls) {
  const border = makeBorderWalls(cols, rows);
  const w = new Uint8Array(cols * rows);
  for (let i = 0; i < w.length; i++) w[i] = border[i] | (innerWalls[i] || 0);
  return w;
}

// Helper: add a wall segment between two adjacent cells
function addWall(walls, cols, x1, y1, x2, y2) {
  if (x2 === x1 + 1) { // wall on east side of (x1,y1)
    walls[y1 * cols + x1] |= EAST;
    walls[y2 * cols + x2] |= WEST;
  } else if (x2 === x1 - 1) {
    walls[y1 * cols + x1] |= WEST;
    walls[y2 * cols + x2] |= EAST;
  } else if (y2 === y1 + 1) {
    walls[y1 * cols + x1] |= SOUTH;
    walls[y2 * cols + x2] |= NORTH;
  } else if (y2 === y1 - 1) {
    walls[y1 * cols + x1] |= NORTH;
    walls[y2 * cols + x2] |= SOUTH;
  }
}

function buildLevel(cols, rows, wallSegments, theseus, minotaur, exit, exitDir) {
  const inner = new Uint8Array(cols * rows);
  for (const [x1, y1, x2, y2] of wallSegments) {
    addWall(inner, cols, x1, y1, x2, y2);
  }
  const walls = mergeWalls(cols, rows, inner);
  // Remove border wall at exit
  const [ex, ey] = exit;
  walls[ey * cols + ex] &= ~exitDir;
  return { cols, rows, theseus, minotaur, exit, exitDir, walls: Array.from(walls) };
}

const LEVELS = [
  // Level 1: 4x3, 4 moves — gentle intro
  buildLevel(4, 3, [
    [1,0, 1,1], [2,0, 2,1],
    [0,1, 1,1], [2,1, 2,2],
    [2,1, 3,1],
  ], [0,2], [3,0], [3,2], EAST),

  // Level 2: 5x4, 7 moves
  buildLevel(5, 4, [
    [1,0, 1,1], [3,0, 3,1],
    [0,1, 0,2], [1,1, 2,1], [3,1, 3,2], [4,1, 4,2],
    [1,2, 1,3], [2,2, 2,3], [2,2, 3,2],
    [3,3, 4,3],
  ], [0,3], [4,0], [4,3], SOUTH),

  // Level 3: 5x4, 10 moves
  buildLevel(5, 4, [
    [1,0,2,0], [2,0,2,1], [3,0,4,0],
    [0,1,0,2], [2,1,2,2],
    [0,2,0,3], [1,2,2,2], [2,2,2,3], [3,2,3,3],
    [2,3,3,3],
  ], [4,2], [0,2], [1,0], NORTH),

  // Level 4: 5x5, 17 moves
  buildLevel(5, 5, [
    [0,0,1,0], [1,0,1,1], [3,0,4,0],
    [0,1,1,1], [2,1,3,1], [3,1,4,1],
    [1,2,1,3], [2,2,3,2], [3,2,4,2], [4,2,4,3],
    [0,3,1,3], [1,3,1,4], [2,3,3,3], [4,3,4,4],
    [3,4,4,4],
  ], [1,0], [0,4], [3,4], SOUTH),

  // Level 5: 6x5, 21 moves
  buildLevel(6, 5, [
    [0,0,1,0], [4,0,4,1],
    [1,1,2,1], [2,1,3,1], [2,1,2,2], [3,1,4,1], [4,1,5,1],
    [1,2,2,2], [1,2,1,3], [2,2,3,2], [3,2,3,3], [4,2,5,2], [5,2,5,3],
    [0,3,1,3], [1,3,2,3], [2,3,3,3], [3,3,3,4], [4,3,4,4],
    [4,4,5,4],
  ], [0,3], [3,1], [5,2], EAST),

  // Level 6: 6x6, 28 moves
  buildLevel(6, 6, [
    [0,0,1,0], [3,0,3,1],
    [0,1,0,2], [1,1,2,1], [1,1,1,2], [4,1,4,2],
    [1,2,1,3], [2,2,3,2], [3,2,4,2], [3,2,3,3],
    [1,3,2,3], [2,3,2,4], [3,3,4,3], [3,3,3,4], [4,3,5,3], [5,3,5,4],
    [1,4,1,5], [2,4,2,5], [5,4,5,5],
  ], [4,4], [1,1], [0,0], NORTH),

  // Level 7: 7x6, 38 moves
  buildLevel(7, 6, [
    [2,0,3,0], [4,0,4,1],
    [0,1,1,1], [0,1,0,2], [1,1,2,1], [2,1,2,2], [4,1,5,1], [4,1,4,2], [6,1,6,2],
    [1,2,1,3], [2,2,3,2], [4,2,4,3],
    [1,3,2,3], [2,3,3,3], [3,3,3,4], [4,3,5,3], [5,3,6,3], [6,3,6,4],
    [2,4,3,4], [2,4,2,5], [3,4,3,5],
    [5,5,6,5],
  ], [1,0], [6,0], [6,5], EAST),

  // Level 8: 7x7, 45 moves
  buildLevel(7, 7, [
    [0,0,1,0], [1,0,1,1], [2,0,3,0], [5,0,5,1], [6,0,6,1],
    [0,1,1,1], [3,1,4,1], [4,1,5,1],
    [0,2,1,2], [1,2,1,3], [2,2,3,2], [3,2,4,2], [4,2,4,3], [5,2,6,2], [6,2,6,3],
    [1,3,2,3], [1,3,1,4], [3,3,4,3], [4,3,4,4], [5,3,5,4],
    [0,4,1,4], [2,4,3,4], [2,4,2,5], [3,4,3,5], [4,4,5,4],
    [0,5,0,6], [1,5,2,5], [3,5,3,6], [4,5,4,6],
    [2,6,3,6], [4,6,5,6],
  ], [1,4], [4,3], [6,2], EAST),
];

// ---- Game State ----
let state = {
  level: 0,
  theseus: [0, 0],
  minotaur: [0, 0],
  maze: null,
  history: [],
  gameOver: false,
  won: false,
};

// ---- Canvas Drawing ----
const canvas = document.getElementById('maze-canvas');
const ctx = canvas.getContext('2d');
const CELL = 64;
const WALL_W = 3;

const COLORS = {
  bg: '#0f0f23',
  floor: '#16213e',
  wall: '#e2b340',
  theseus: '#3498db',
  minotaur: '#e74c3c',
  exit: '#4ecca3',
  exitGlow: 'rgba(78, 204, 163, 0.15)',
  trail: 'rgba(52, 152, 219, 0.08)',
};

function resizeCanvas() {
  if (!state.maze) return;
  const { cols, rows } = state.maze;
  canvas.width = cols * CELL + WALL_W * 2;
  canvas.height = rows * CELL + WALL_W * 2;
}

function draw() {
  if (!state.maze) return;
  const { cols, rows, walls, exit, exitDir } = state.maze;
  const off = WALL_W; // offset for outer border

  // Background
  ctx.fillStyle = COLORS.bg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Floor tiles
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      ctx.fillStyle = COLORS.floor;
      ctx.fillRect(off + x * CELL + 1, off + y * CELL + 1, CELL - 2, CELL - 2);
    }
  }

  // Exit highlight
  const [ex, ey] = exit;
  ctx.fillStyle = COLORS.exitGlow;
  ctx.fillRect(off + ex * CELL, off + ey * CELL, CELL, CELL);

  // Draw exit marker (arrow or gap indicator)
  ctx.save();
  ctx.fillStyle = COLORS.exit;
  ctx.globalAlpha = 0.7;
  const ecx = off + ex * CELL + CELL / 2;
  const ecy = off + ey * CELL + CELL / 2;
  const arrowSize = 10;
  ctx.beginPath();
  if (exitDir === NORTH) {
    ctx.moveTo(ecx, off + ey * CELL + 4);
    ctx.lineTo(ecx - arrowSize, off + ey * CELL + 4 + arrowSize);
    ctx.lineTo(ecx + arrowSize, off + ey * CELL + 4 + arrowSize);
  } else if (exitDir === SOUTH) {
    ctx.moveTo(ecx, off + (ey + 1) * CELL - 4);
    ctx.lineTo(ecx - arrowSize, off + (ey + 1) * CELL - 4 - arrowSize);
    ctx.lineTo(ecx + arrowSize, off + (ey + 1) * CELL - 4 - arrowSize);
  } else if (exitDir === EAST) {
    ctx.moveTo(off + (ex + 1) * CELL - 4, ecy);
    ctx.lineTo(off + (ex + 1) * CELL - 4 - arrowSize, ecy - arrowSize);
    ctx.lineTo(off + (ex + 1) * CELL - 4 - arrowSize, ecy + arrowSize);
  } else if (exitDir === WEST) {
    ctx.moveTo(off + ex * CELL + 4, ecy);
    ctx.lineTo(off + ex * CELL + 4 + arrowSize, ecy - arrowSize);
    ctx.lineTo(off + ex * CELL + 4 + arrowSize, ecy + arrowSize);
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // Draw walls
  ctx.strokeStyle = COLORS.wall;
  ctx.lineWidth = WALL_W;
  ctx.lineCap = 'round';

  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const w = walls[y * cols + x];
      const cx = off + x * CELL;
      const cy = off + y * CELL;
      if (w & NORTH) {
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + CELL, cy); ctx.stroke();
      }
      if (w & SOUTH) {
        ctx.beginPath(); ctx.moveTo(cx, cy + CELL); ctx.lineTo(cx + CELL, cy + CELL); ctx.stroke();
      }
      if (w & WEST) {
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx, cy + CELL); ctx.stroke();
      }
      if (w & EAST) {
        ctx.beginPath(); ctx.moveTo(cx + CELL, cy); ctx.lineTo(cx + CELL, cy + CELL); ctx.stroke();
      }
    }
  }

  // Draw Minotaur
  drawMinotaur(off + state.minotaur[0] * CELL + CELL / 2, off + state.minotaur[1] * CELL + CELL / 2);

  // Draw Theseus
  drawTheseus(off + state.theseus[0] * CELL + CELL / 2, off + state.theseus[1] * CELL + CELL / 2);
}

function drawTheseus(cx, cy) {
  const r = CELL * 0.28;
  // Glow
  ctx.save();
  ctx.shadowColor = COLORS.theseus;
  ctx.shadowBlur = 12;
  ctx.fillStyle = COLORS.theseus;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Shield icon (small circle inside)
  ctx.fillStyle = '#1a1a2e';
  ctx.beginPath();
  ctx.arc(cx, cy, r * 0.45, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = COLORS.theseus;
  ctx.beginPath();
  ctx.arc(cx, cy, r * 0.25, 0, Math.PI * 2);
  ctx.fill();
}

function drawMinotaur(cx, cy) {
  const r = CELL * 0.3;
  // Glow
  ctx.save();
  ctx.shadowColor = COLORS.minotaur;
  ctx.shadowBlur = 14;
  ctx.fillStyle = COLORS.minotaur;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Horns
  ctx.strokeStyle = COLORS.minotaur;
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx - r * 0.5, cy - r * 0.3);
  ctx.lineTo(cx - r * 0.9, cy - r * 1.1);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx + r * 0.5, cy - r * 0.3);
  ctx.lineTo(cx + r * 0.9, cy - r * 1.1);
  ctx.stroke();

  // Eyes
  ctx.fillStyle = '#1a1a2e';
  ctx.beginPath();
  ctx.arc(cx - r * 0.3, cy - r * 0.1, r * 0.15, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx + r * 0.3, cy - r * 0.1, r * 0.15, 0, Math.PI * 2);
  ctx.fill();
}

// ---- Movement Logic ----
function hasWall(walls, cols, x, y, dir) {
  return (walls[y * cols + x] & dir) !== 0;
}

function canMove(maze, x, y, dir) {
  if (hasWall(maze.walls, maze.cols, x, y, dir)) return false;
  const nx = x + DX[dir];
  const ny = y + DY[dir];
  if (nx < 0 || ny < 0 || nx >= maze.cols || ny >= maze.rows) {
    // Can move off the board only at the exit
    return (x === maze.exit[0] && y === maze.exit[1] && dir === maze.exitDir);
  }
  return true;
}

function moveMinotaurOneStep(maze, mx, my, tx, ty) {
  // Horizontal first
  if (mx < tx && canMove(maze, mx, my, EAST))  return [mx + 1, my];
  if (mx > tx && canMove(maze, mx, my, WEST))  return [mx - 1, my];
  // Then vertical
  if (my < ty && canMove(maze, mx, my, SOUTH)) return [mx, my + 1];
  if (my > ty && canMove(maze, mx, my, NORTH)) return [mx, my - 1];
  // Can't move
  return [mx, my];
}

function moveMinotaur(maze, mx, my, tx, ty) {
  // Minotaur gets 2 moves
  let [nx, ny] = moveMinotaurOneStep(maze, mx, my, tx, ty);
  [nx, ny] = moveMinotaurOneStep(maze, nx, ny, tx, ty);
  return [nx, ny];
}

// ---- Game Actions ----
function loadLevel(n) {
  const lvl = LEVELS[n];
  state.level = n;
  state.maze = { ...lvl, walls: [...lvl.walls] };
  state.theseus = [...lvl.theseus];
  state.minotaur = [...lvl.minotaur];
  state.history = [];
  state.gameOver = false;
  state.won = false;
  resizeCanvas();
  updateStatus('');
  draw();
}

function doMove(dir) {
  if (state.gameOver) return;

  const maze = state.maze;
  const [tx, ty] = state.theseus;
  const [mx, my] = state.minotaur;

  // Save state for undo
  state.history.push({ theseus: [tx, ty], minotaur: [mx, my] });

  let ntx = tx, nty = ty;

  if (dir !== null) {
    if (!canMove(maze, tx, ty, dir)) {
      state.history.pop();
      return; // Can't move there
    }
    ntx = tx + DX[dir];
    nty = ty + DY[dir];

    // Check if Theseus stepped through the exit
    if (ntx < 0 || nty < 0 || ntx >= maze.cols || nty >= maze.rows) {
      state.theseus = [tx, ty]; // stay on exit cell visually
      state.gameOver = true;
      state.won = true;
      updateStatus('You escaped the labyrinth!');
      draw();
      return;
    }
  }

  state.theseus = [ntx, nty];

  // Minotaur moves
  const [nmx, nmy] = moveMinotaur(maze, mx, my, ntx, nty);
  state.minotaur = [nmx, nmy];

  // Check if caught
  if (nmx === ntx && nmy === nty) {
    state.gameOver = true;
    state.won = false;
    updateStatus('The Minotaur caught you!');
  } else {
    updateStatus('');
  }

  draw();
}

function undo() {
  if (state.gameOver && state.won) return; // don't undo a win
  if (state.history.length === 0) return;
  const prev = state.history.pop();
  state.theseus = prev.theseus;
  state.minotaur = prev.minotaur;
  state.gameOver = false;
  state.won = false;
  updateStatus('');
  draw();
}

function restart() {
  loadLevel(state.level);
}

function updateStatus(msg) {
  const el = document.getElementById('status');
  el.textContent = msg || '\u00a0';
  el.className = '';
  if (state.won) el.className = 'win';
  else if (state.gameOver) el.className = 'lose';
}

// ---- Input Handling ----
document.addEventListener('keydown', (e) => {
  const key = e.key.toLowerCase();
  switch (key) {
    case 'arrowup':    case 'w': e.preventDefault(); doMove(NORTH); break;
    case 'arrowdown':  case 's': e.preventDefault(); doMove(SOUTH); break;
    case 'arrowleft':  case 'a': e.preventDefault(); doMove(WEST);  break;
    case 'arrowright': case 'd': e.preventDefault(); doMove(EAST);  break;
    case ' ':          e.preventDefault(); doMove(null); break; // wait
    case 'z':          e.preventDefault(); undo(); break;
    case 'r':          e.preventDefault(); restart(); break;
  }
});

// D-pad buttons
document.querySelectorAll('#dpad button').forEach(btn => {
  btn.addEventListener('click', () => {
    const dir = btn.dataset.dir;
    switch (dir) {
      case 'up':    doMove(NORTH); break;
      case 'down':  doMove(SOUTH); break;
      case 'left':  doMove(WEST); break;
      case 'right': doMove(EAST); break;
      case 'wait':  doMove(null); break;
    }
  });
});

document.getElementById('btn-undo').addEventListener('click', undo);
document.getElementById('btn-restart').addEventListener('click', restart);

// Level selector
const levelSelect = document.getElementById('level-select');
LEVELS.forEach((_, i) => {
  const opt = document.createElement('option');
  opt.value = i;
  opt.textContent = `Level ${i + 1}`;
  levelSelect.appendChild(opt);
});
levelSelect.addEventListener('change', () => {
  loadLevel(parseInt(levelSelect.value));
});

// ---- Click/Tap to move ----
canvas.addEventListener('click', (e) => {
  if (state.gameOver) return;
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const mx = (e.clientX - rect.left) * scaleX - WALL_W;
  const my = (e.clientY - rect.top) * scaleY - WALL_W;
  const cellX = Math.floor(mx / CELL);
  const cellY = Math.floor(my / CELL);
  const [tx, ty] = state.theseus;
  const dx = cellX - tx;
  const dy = cellY - ty;

  if (dx === 0 && dy === 0) { doMove(null); return; }
  // Determine primary direction
  if (Math.abs(dx) >= Math.abs(dy)) {
    doMove(dx > 0 ? EAST : WEST);
  } else {
    doMove(dy > 0 ? SOUTH : NORTH);
  }
});

// ---- Init ----
loadLevel(0);
</script>
</body>
</html>
